<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>알파벳 구름 탐험</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../wardrobe.css" />
  </head>
  <body>
    <main>
      <nav>
        <a href="../math/">수학</a>
        <strong>영어</strong>
        <a href="../typing/">타자</a>
        <a href="../../">게임 홈</a>
      </nav>
      <h1>알파벳 구름 탐험</h1>
      <p>← → 방향키로 움직여 내려오는 영어 구슬을 모으세요.</p>

      <section class="game-wrap">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="startScreen" class="overlay">
          <form id="startForm" class="panel">
            <strong>영어 탐험 준비!</strong>
            <label for="playerName">사용자 이름</label>
            <input
              id="playerName"
              maxlength="12"
              autocomplete="nickname"
              placeholder="이름을 입력하세요"
              required
            />
            <button type="submit">게임 시작</button>
            <div class="ranking">
              <b>최고 기록</b>
              <ol id="leaderboard"></ol>
            </div>
          </form>
        </div>

        <div id="challenge" class="overlay" hidden>
          <form id="challengeForm" class="panel challenge-panel">
            <strong id="stageLabel">알파벳 문제</strong>
            <button id="listen" class="listen" type="button">🔊 다시 듣기</button>
            <div id="prompt" class="prompt"></div>
            <label for="answer">들은 내용을 입력하세요</label>
            <input
              id="answer"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              required
            />
            <button id="submitAnswer" type="submit">정답 확인</button>
            <p id="feedback" aria-live="polite"></p>
          </form>
        </div>

        <div id="stageClear" class="overlay" hidden>
          <div class="panel">
            <strong id="clearTitle">단어 단계 해금!</strong>
            <p id="clearText"></p>
            <button id="continueStage" type="button">계속하기</button>
          </div>
        </div>

        <div id="gameOver" class="overlay" hidden>
          <div class="panel">
            <strong>영어 탐험 끝!</strong>
            <p id="finalScore"></p>
            <button id="restart" type="button">처음 화면으로</button>
          </div>
        </div>
      </section>
      <div class="mobile-controls" aria-label="모바일 이동 방향키">
        <button type="button" data-key="ArrowLeft" aria-label="왼쪽으로 이동">← <span>왼쪽</span></button>
        <button type="button" data-key="ArrowRight" aria-label="오른쪽으로 이동"><span>오른쪽</span> →</button>
      </div>
      <section id="wardrobe" class="wardrobe" aria-label="캐릭터 의상 보관함">
        <h2>✨ 캐릭터 의상 보관함</h2><div class="wardrobe-grid">
          <button type="button" data-outfit="0">꽃무늬 원피스<small></small></button><button type="button" data-outfit="1">하늘빛 모험가<small></small></button><button type="button" data-outfit="2">별빛 드레스<small></small></button><button type="button" data-outfit="3">보라빛 마법사<small></small></button>
        </div>
      </section>

      <p id="status" aria-live="polite">이름을 입력하고 시작해 주세요.</p>
    </main>
    <script src="../wardrobe.js?v=8"></script><script src="./game.js"></script>
  </body>
</html>
